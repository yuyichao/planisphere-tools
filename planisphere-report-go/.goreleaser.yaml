uploads:
  - name: production
    target: https://oneget.oit.duke.edu/rpm/devil-ops-rpms/
    method: PUT
    mode: archive
    custom_headers:
      X-ApiKey: "{{ .Env.UPLOAD_PRODUCTION_SECRET }}"
    ids:
      - rpms
  - name: production
    target: https://oneget.oit.duke.edu/debian-packages/upload/devil-ops-debs/main/
    method: PUT
    mode: archive
    username: api
    ids:
      - debs
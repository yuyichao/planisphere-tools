---
gitlab_urls:
  api: https://gitlab.oit.duke.edu/api/v4/
  download: https://gitlab.oit.duke.edu
  use_package_registry: true
  use_job_token: true
env:
  - VAULT_ADDR={{ .Env.VAULT_ADDR }}
  - TRANSIT_SECRET_ENGINE_PATH=ssi-systems/transit
  - VAULT_TOKEN={{ .Env.VAULT_TOKEN }}
release:
  gitlab:
    owner: devil-ops
    name: planisphere-tools
  name_template: "Planisphere-report Go {{.Tag}}"
  header: |
    ## Planisphere-report Go ({{ .Date }})

    This Go version should be used for non-windows based operating systems
project_name: planisphere-report
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cli/
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags: >
      -s -w
      -X gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go/cli/cmd.date={{ .CommitTimestamp }}
      -X gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go/cli/cmd.version={{ .Tag }}
      -X gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go/cli/cmd.commit={{ .ShortCommit }}'
    goos:
      - darwin
      - freebsd
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    binary: 'planisphere-report'
universal_binaries:
  - replace: false
archives:
  - format: tar.gz
    #name_template: 'planisphere-report-{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    name_template: >-
      planisphere-report_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'planisphere-report-{{ .Version }}_SHA256SUMS'
  algorithm: sha256
snapshot:
  name_template: "{{ .Tag }}-snapshot"
changelog:
  skip: false
brews:
  - tap:
      owner: devil-ops
      name: homebrew-devil-ops
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    description: "Planisphere Self Report"
    name: "planisphere-report"
    homepage: "https://gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go"
    install: |
      bin.install "planisphere-report"
    service: |
      run [bin/"planisphere-report", "report"]
      run_type :interval
      interval 3600
      working_dir HOMEBREW_PREFIX
      log_path var/"log/planisphere-report.log"
      error_log_path var/"log/planisphere-report.err"
    caveats: |
      Please make sure to update your configuration file with your Planisphere
      Self Report Key and any overrides or extra data before (re)starting the
      service (via brew services or by restarting your computer):

          $ sudo vi /etc/planisphere-report.yaml
          $ brew services start planisphere-report
          $ brew services stop planisphere-report

      Note: If you are having issues starting the brew service, run the following to clean out previous versions:

        $ launchctl unload ~/Library/LaunchAgents/homebrew.mxcl.planisphere-report.plist

      Not sure why this is sometimes needed, but like...patches welcome! 😁

      Log files are available at
        /usr/local/var/log/planisphere-report.log
      and
        /usr/local/var/log/planisphere-report.err
nfpms:
  - id: rpms
    bindir: /usr/bin
    license: MIT
    description: Planisphere Self Report Tool
    vendor: Duke University
    section: admin
    priority: optional
    homepage: https://gitlab.oit.duke.edu/devil-ops/planisphere-tools
    maintainer: Drew Stinnett <drew.stinnett@duke.edu>
    rpm:
      signature:
        key_file: "{{ .Env.GPG_KEY_PATH }}"
    formats:
      - rpm
    contents:
      - src: packaging/systemd/planisphere-report.service
        dst: /usr/lib/systemd/system/planisphere-report.service
        file_info:
          mode: 0644
          group: root
          owner: root
      - src: packaging/systemd/planisphere-report.timer
        dst: /usr/lib/systemd/system/planisphere-report.timer
        file_info:
          mode: 0644
          group: root
          owner: root
    scripts:
      postinstall: "packaging/scripts/postinstall.sh"
      preremove: "packaging/scripts/preremove.sh"
      postremove: "packaging/scripts/postremove.sh"
  - id: debs
    bindir: /usr/bin
    license: MIT
    description: Planisphere Self Report Tool
    vendor: Duke University
    section: admin
    priority: optional
    homepage: https://gitlab.oit.duke.edu/devil-ops/planisphere-tools
    maintainer: Drew Stinnett <drew.stinnett@duke.edu>
    formats:
      - deb
    contents:
      - src: packaging/systemd/planisphere-report.service
        dst: /usr/lib/systemd/system/planisphere-report.service
        file_info:
          mode: 0644
          group: root
          owner: root
      - src: packaging/systemd/planisphere-report.timer
        dst: /usr/lib/systemd/system/planisphere-report.timer
        file_info:
          mode: 0644
          group: root
          owner: root
    scripts:
      postinstall: "packaging/scripts/postinstall.sh"
      preremove: "packaging/scripts/preremove.sh"
      postremove: "packaging/scripts/postremove.sh"
  - id: apks
    bindir: /usr/bin
    license: MIT
    description: Planisphere Self Report Tool
    vendor: Duke University
    section: admin
    priority: optional
    homepage: https://gitlab.oit.duke.edu/devil-ops/planisphere-tools
    maintainer: Drew Stinnett <drew.stinnett@duke.edu>
    formats:
      - apk
    contents:
      - src: packaging/systemd/planisphere-report.service
        dst: /usr/lib/systemd/system/planisphere-report.service
        file_info:
          mode: 0644
          group: root
          owner: root
      - src: packaging/systemd/planisphere-report.timer
        dst: /usr/lib/systemd/system/planisphere-report.timer
        file_info:
          mode: 0644
          group: root
          owner: root
    scripts:
      postinstall: "packaging/scripts/postinstall.sh"
      preremove: "packaging/scripts/preremove.sh"
      postremove: "packaging/scripts/postremove.sh"
  - id: archlinux
    bindir: /usr/bin
    license: MIT
    description: Planisphere Self Report Tool
    vendor: Duke University
    section: admin
    priority: optional
    homepage: https://gitlab.oit.duke.edu/devil-ops/planisphere-tools
    maintainer: Drew Stinnett <drew.stinnett@duke.edu>
    formats:
      - archlinux
    contents:
      - src: packaging/systemd/planisphere-report.service
        dst: /usr/lib/systemd/system/planisphere-report.service
        file_info:
          mode: 0644
          group: root
          owner: root
      - src: packaging/systemd/planisphere-report.timer
        dst: /usr/lib/systemd/system/planisphere-report.timer
        file_info:
          mode: 0644
          group: root
          owner: root
    scripts:
      postinstall: "packaging/scripts/postinstall.sh"
      preremove: "packaging/scripts/preremove.sh"
      postremove: "packaging/scripts/postremove.sh"
uploads:
  - name: productionrpm
    target: https://oneget.oit.duke.edu/rpm/devil-ops-rpms/
    method: PUT
    mode: archive
    username: api
    ids:
      - rpms
  - name: productiondeb
    target: https://oneget.oit.duke.edu/debian-packages/upload/devil-ops-debs/main/
    method: PUT
    mode: archive
    username: api
    ids:
      - debs
signs:
- cmd: cosign
  args: ["sign-blob", "--key=hashivault://package-signing", "--output-signature=${signature}", "${artifact}"]
  artifacts: all
sboms:
  - artifacts: archive
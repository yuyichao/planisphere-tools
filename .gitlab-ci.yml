---
stages:
  - test
  - release

# Need to run this on all oses, or at least linux for this to work
unit_tests:
  stage: test
  image: image-mirror-prod-registry.cloud.duke.edu/library/golang:1.17
  script:
    - cd planisphere-report-go
    - go test gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go/helpers

# Need to run this on all oses, or at least linux for this to work
coverage:
  stage: test
  image: image-mirror-prod-registry.cloud.duke.edu/library/golang:1.17
  script:
    - cd planisphere-report-go
    - go mod tidy
    - go test -v gitlab.oit.duke.edu/devil-ops/planisphere-tools/planisphere-report-go/helpers -coverprofile .testCoverage.txt

lint:
  image: registry.gitlab.com/gitlab-org/gitlab-build-images:golangci-lint-alpine
  stage: test
  script:
    # Use default .golangci.yml file from the image if one is not present in the project root.
    - '[ -e .golangci.yml ] || cp /golangci/.golangci.yml .'
    # Write the code coverage report to gl-code-quality-report.json
    # and print linting issues to stdout in the format: path/to/file:line description
    # remove `--issues-exit-code 0` or set to non-zero to fail the job if linting issues are detected
    - cd planisphere-report-go
    - golangci-lint run --issues-exit-code 0 --out-format code-climate | tee gl-code-quality-report.json | jq -r '.[] | "\(.location.path):\(.location.lines.begin) \(.description)"'
  artifacts:
    reports:
      codequality: planisphere-report-go/gl-code-quality-report.json
    paths:
      - planisphere-report-go/gl-code-quality-report.json

release:
  stage: release
  image:
    name: image-mirror-prod-registry.cloud.duke.edu/goreleaser/goreleaser:v0.182.1
    entrypoint: ['']
  services:
    - name: docker:dind
      command: ["--registry-mirror=https://image-mirror-prod-registry.cloud.duke.edu"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+/ '
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - cd planisphere-report-go
    - goreleaser release --rm-dist
